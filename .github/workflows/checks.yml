name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    name: Planning / ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Run repository and planning checks
        run: python -B scripts/check_repo.py

  reference-cpu:
    name: Historical PicoRV32 smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Simulate reference CPU
        run: bash sim/starter/run.sh

  custom-cpu:
    name: Custom RV64 CPU simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus
        run: sudo apt-get update && sudo apt-get install -y iverilog
      - name: Run custom CPU differential, reset and RAM tests
        run: bash sim/cpu/run.sh

  dhrystone:
    name: Dhrystone benchmark simulation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Icarus and LLVM
        run: sudo apt-get update && sudo apt-get install -y iverilog clang lld llvm
      - name: Build Dhrystone
        run: python -B sim/cpu/bench/build_bench.py
      - name: Run and check Dhrystone on the RTL
        run: python -B sim/cpu/bench/run_bench.py
